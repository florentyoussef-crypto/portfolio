<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Florent Youssef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: une carte de supervision réseau. Florent est le cœur du réseau, chaque partie du portfolio est un nœud relié par une fibre violette ; cliquer un nœud ouvre son panneau. Thème sombre unique, par choix. */
:root {
  --bg: #100C1A;
  --panel: #17112A;
  --node: #1C1533;
  --ink: #EEEAF7;
  --muted: #A39BB8;
  --line: #2E2547;
  --fiber: #A78BFA;
  --up: #3DDC84;
  --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --body: "Manrope", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--body);
  -webkit-font-smoothing: antialiased; overflow: hidden;
  background-image:
    radial-gradient(60% 55% at 50% 48%, rgba(124, 92, 255, .20), transparent 70%),
    radial-gradient(40% 40% at 85% 10%, rgba(196, 181, 253, .08), transparent 70%),
    radial-gradient(circle at 1px 1px, #241B3A 1px, transparent 0);
  background-size: 100% 100%, 100% 100%, 26px 26px;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--fiber); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }

/* Barre du haut */
.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 22px; }
.brand { font: 800 20px/1 var(--display); letter-spacing: -.01em; }
.brand small { display: block; font: 500 11px/1.4 var(--mono); color: var(--muted); letter-spacing: .04em; margin-top: 4px; }
.status { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--mono); padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--panel) 85%, transparent); white-space: nowrap; }
.led { width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 3px color-mix(in srgb, var(--up) 22%, transparent); animation: blink 2.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }

/* Carte */
.map-wrap { position: relative; min-height: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.link { stroke-width: 2.5; opacity: .7; stroke-linecap: round; transition: opacity .25s, stroke-width .25s; }
.link.leaf { stroke-width: 1.8; opacity: .55; stroke-dasharray: 1 7; }
.link.on { opacity: 1; stroke-width: 4.5; stroke-dasharray: none; }
.pkt { fill: #F5F3FF; }
.orbit { fill: none; stroke: #6D55C9; stroke-width: 1; stroke-dasharray: 2 10; opacity: .35; }
.orbits { transform-box: view-box; animation: spin 140s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.icon { fill: none; stroke: var(--fiber); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.node.leaf .icon { stroke-width: 1.7; }
.node .outer { fill: none; stroke: var(--fiber); stroke-width: 1; opacity: .25; }
.node { cursor: pointer; outline: none; }
.node .ring { fill: url(#nodefill); stroke: var(--fiber); stroke-width: 2; transition: stroke-width .2s; }
.node.leaf .ring { stroke: #8B6FE0; stroke-width: 1.5; }
.node .halo { fill: none; stroke: var(--fiber); stroke-width: 1; opacity: 0; transition: opacity .2s, r .2s; }
.node .code { fill: var(--fiber); font: 600 15px var(--mono); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.node.leaf .code { font-size: 12px; }
.node .lab { fill: var(--ink); font: 700 17px var(--body); text-anchor: middle; pointer-events: none; }
.lbg { fill: #140F24; opacity: .88; stroke: rgba(167, 139, 250, .2); stroke-width: 1; }
.node .sub { fill: var(--muted); font: 400 12px var(--mono); text-anchor: middle; pointer-events: none; }
.node.leaf .lab { font-size: 14px; }
.node:hover .ring, .node:focus-visible .ring, .node.active .ring { stroke-width: 3; }
.node:hover .icon, .node:focus-visible .icon, .node.active .icon { stroke: #F5F3FF; }
.node { transition: opacity .25s; }
.node .scale { transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.node:hover .scale, .node:focus-visible .scale { transform: scale(1.07); }
.node:hover .halo, .node:focus-visible .halo, .node.active .halo { opacity: .6; }
.node:focus-visible .lab { text-decoration: underline; }
.hub .ring { stroke-width: 0; fill: url(#hubfill); filter: url(#glow); }
.hub:hover .ring, .hub:focus-visible .ring, .hub.active .ring { stroke: #F5F3FF; stroke-width: 2; }
.hub .halo { display: none; }
.hub .beat { transform-box: fill-box; transform-origin: center; animation: heartbeat 3s ease-in-out infinite; }
@keyframes heartbeat { 0% { transform: scale(1); } 6% { transform: scale(1.1); } 12% { transform: scale(1); } 18% { transform: scale(1.05); } 26%, 100% { transform: scale(1); } }
.hub .ripple { fill: none; stroke: #B9A6FF; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ripple 1.6s ease-out infinite; }
.hub .ripple.r2 { animation-delay: .3s; stroke-width: 1.2; }
@keyframes ripple { 0% { transform: scale(1); opacity: .65; } 70%, 100% { transform: scale(1.8); opacity: 0; } }
.dot { fill: #F5F3FF; }
.bit { fill: #E2DAFF; font: 700 10px var(--mono); text-anchor: middle; dominant-baseline: central; }
.hub .mono { fill: #FFFFFF; font: 800 34px var(--display); text-anchor: middle; dominant-baseline: central; pointer-events: none; letter-spacing: -.02em; }
.hub .hubsub { fill: #EDE7FF; font: 600 10px var(--mono); text-anchor: middle; pointer-events: none; text-transform: uppercase; letter-spacing: .12em; opacity: .75; }
.hub .name { fill: var(--ink); font: 800 26px var(--display); text-anchor: middle; pointer-events: none; }
.hub .role { fill: var(--muted); font: 500 12px var(--mono); text-anchor: middle; pointer-events: none; }
.dim .node:not(.active) { opacity: .35; }
.dim .link:not(.on) { opacity: .15; }
.node, .link { transition: opacity .25s; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); top: 4px; font: 500 12px/1 var(--mono); color: var(--muted); pointer-events: none; white-space: nowrap; }

/* Bandeau du bas */
.strip { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; padding: 12px 18px 16px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 90%, transparent); font: 500 12px/1.3 var(--mono); color: var(--muted); }
.strip b { color: var(--ink); font-weight: 500; }

/* Panneau */
.scrim { position: fixed; inset: 0; background: rgba(8, 4, 16, .6); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
.panel {
  position: fixed; z-index: 30; top: 12px; right: 12px; bottom: 12px; width: min(640px, calc(100% - 24px));
  background: rgba(23, 17, 42, .86); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border: 1px solid rgba(167, 139, 250, .22); border-radius: 20px; box-shadow: 0 30px 90px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
  overflow: hidden;
  display: grid; grid-template-rows: auto 1fr; transform: translateX(calc(100% + 24px)); transition: transform .32s cubic-bezier(.2,.8,.2,1);
}
.panel.open { transform: none; }
.panel.left { left: 12px; right: auto; transform: translateX(calc(-100% - 24px)); }
.panel.left.open { transform: none; }
@media (max-width: 700px) {
  .panel, .panel.left { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 86%; transform: translateY(calc(100% + 16px)); }
  .panel.open, .panel.left.open { transform: none; }
}
.p-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding: 22px 22px 16px; border-bottom: 1px solid var(--line); position: relative;
  background: linear-gradient(180deg, rgba(124, 92, 255, .14), transparent); }
.p-head::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, #7C5CFF, #C4B5FD, #7C5CFF); }
.crumb { font: 500 12px/1.4 var(--mono); color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.crumb button { background: none; border: 0; padding: 0; color: var(--fiber); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 3px; }
.p-head h2 { font: 800 clamp(28px, 4.4vw, 40px)/1.05 var(--display); margin-top: 6px; letter-spacing: -.015em;
  background: linear-gradient(90deg, #FFFFFF, #C4B5FD); -webkit-background-clip: text; background-clip: text; color: transparent; }
.close { flex: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--node); cursor: pointer; font: 600 18px/1 var(--mono); }
.close:hover { border-color: var(--fiber); }
.p-body { overflow-y: auto; padding: 20px 22px 28px; display: grid; gap: 22px; align-content: start; }
.lead { font-size: 17px; line-height: 1.55; }
.muted { color: var(--muted); }
.k { font: 600 11px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 8px; }
.p-body ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.p-body li::marker { color: var(--fiber); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 500 12px/1 var(--mono); padding: 7px 9px; border-radius: 6px; background: #241C3D; }
.tag.y { background: var(--fiber); color: #1B1033; }
.chip { display: inline-flex; align-items: center; gap: 8px; font: 500 12px/1 var(--mono); padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line); }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.chip.live::before { background: var(--up); }
.spec { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.spec div { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.spec div:nth-child(odd) { border-right: 1px solid var(--line); }
.spec div:nth-last-child(-n+2) { border-bottom: 0; }
.spec span { display: block; font: 500 10.5px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 5px; }
.spec b { font-weight: 600; font-size: 15px; }
.me { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; }
.me img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid var(--fiber); }
.cards { display: grid; gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: linear-gradient(160deg, #221A3E, #1A1430); display: grid; gap: 8px; transition: border-color .2s, transform .2s; }
.card:hover { border-color: rgba(167, 139, 250, .55); transform: translateY(-2px); }
.card h3 { font: 800 22px/1.1 var(--display); }
.card .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.go { background: var(--fiber); color: #1B1033; border: 0; border-radius: 8px; padding: 9px 14px; font: 700 14px/1 var(--body); cursor: pointer; }
.go:hover { filter: brightness(1.08); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 560px) { .two, .spec { grid-template-columns: 1fr; } .spec div:nth-child(odd) { border-right: 0; } .spec div:nth-last-child(2) { border-bottom: 1px solid var(--line); } }

/* Schémas */
figure { margin: 0; }
.diagram { overflow-x: auto; border: 1px dashed var(--line); border-radius: 12px; padding: 12px; background: var(--bg); }
.diagram svg { display: block; width: 100%; min-width: 540px; height: auto; color: var(--ink); }
figcaption { font: 400 12.5px/1.45 var(--body); color: var(--muted); margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.key { display: inline-flex; align-items: center; gap: 6px; font: 500 11.5px/1 var(--mono); }
.key i { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
.k-mine { background: var(--fiber); }
.k-part { border: 1.5px dashed var(--fiber); }
.k-fiber { height: 4px !important; background: var(--fiber); }
.k-next { border: 1.5px dashed var(--muted); }
.n { fill: var(--node); stroke: currentColor; stroke-width: 1.3; }
.n-mine { fill: var(--fiber); stroke: var(--fiber); }
.n-part { fill: var(--node); stroke: var(--fiber); stroke-width: 2; stroke-dasharray: 5 4; }
.n-next { fill: none; stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 5 4; }
.grp { fill: none; stroke: var(--muted); stroke-width: 1.1; stroke-dasharray: 3 4; }
.t { fill: currentColor; font: 600 13px var(--body); }
.t-dark { fill: #1B1033; font: 700 13px var(--body); }
.t-s { fill: var(--muted); font: 400 11px var(--mono); }
.t-s-dark { fill: #3B2470; font: 500 11px var(--mono); }
.t-lab { fill: var(--muted); font: 500 11px var(--mono); }
.t-next { fill: var(--muted); font: 600 13px var(--body); }
.w { stroke: currentColor; stroke-width: 1.3; fill: none; }
.w-fiber { stroke: var(--fiber); stroke-width: 5; fill: none; stroke-linecap: round; }
.w-vpn { stroke: var(--up); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
.ah { fill: currentColor; }

/* Compétences */
.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .skills { grid-template-columns: 1fr; } }
.skill { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--node); }
.skill h3 { font: 800 18px/1.1 var(--display); margin-bottom: 10px; }
.skill ul { list-style: none; padding: 0; gap: 7px; }
.skill li { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; }
.lvl { font: 500 11px/1.6 var(--mono); color: var(--muted); white-space: nowrap; }
.lvl.p { color: var(--fiber); }

/* Parcours */
.tl { list-style: none; margin: 0; padding: 0; border-left: 3px solid var(--fiber); display: grid; gap: 20px; }
.tl li { position: relative; padding-left: 20px; }
.tl li::before { content: ""; position: absolute; left: -10px; top: 5px; width: 13px; height: 13px; border-radius: 50%; background: var(--panel); border: 3px solid var(--fiber); }
.when { font: 500 12px/1.2 var(--mono); color: var(--muted); }
.tl h3 { font: 700 17px/1.3 var(--body); margin-top: 4px; }
.tl p { color: var(--muted); font-size: 15px; margin-top: 3px; }
.facts { display: grid; gap: 10px; }
.fact { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--node); display: grid; grid-template-columns: 96px 1fr; gap: 14px; }
.fact .num { font: 800 28px/1 var(--display); color: var(--fiber); }
.fact .num small { display: block; font: 500 11px/1.3 var(--mono); color: var(--muted); margin-top: 4px; }
.fact h3 { font: 700 16px/1.3 var(--body); }
.fact p { color: var(--muted); font-size: 14.5px; margin-top: 3px; }

/* Contact */
.c-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--node); flex-wrap: wrap; font: 500 15px/1.3 var(--mono); }
.c-row span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; }
.c-btn { background: var(--fiber); color: #1B1033; border: 0; border-radius: 8px; padding: 9px 14px; font: 700 14px/1 var(--body); cursor: pointer; text-decoration: none; }

@media (max-width: 700px) {
  .top { padding: 12px 14px; }
  .status { font-size: 11px; padding: 7px 10px; }
  .brand small { display: none; }
  .strip { font-size: 11px; gap: 4px 12px; }
}
@media (max-width: 420px) { .status .long { display: none; } }
/* Animations coupées quand le visiteur l'a demandé (réglage système ou bouton) */
body.no-anim .led { animation: none; }
body.no-anim .panel, body.no-anim .scrim, body.no-anim .node, body.no-anim .link, body.no-anim .card, body.no-anim .node .scale { transition: none; }
body.no-anim .orbits, body.no-anim .hub .beat, body.no-anim .hub .ripple { animation: none; }
body.no-anim .hub .ripple { display: none; }
.top-right { display: flex; align-items: center; gap: 8px; }
.anim-btn { display: inline-flex; align-items: center; gap: 7px; font: 500 12px/1 var(--mono); padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--panel) 85%, transparent); color: var(--muted); cursor: pointer; }
.anim-btn:hover { color: var(--ink); border-color: var(--fiber); }
.anim-btn .sw { width: 22px; height: 12px; border-radius: 999px; background: #3A3058; position: relative; transition: background .2s; }
.anim-btn .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 8px; height: 8px; border-radius: 50%; background: #CFC6EA; transition: transform .2s; }
.anim-btn[aria-pressed="true"] .sw { background: var(--fiber); }
.anim-btn[aria-pressed="true"] .sw::after { transform: translateX(10px); background: #fff; }
@media (max-width: 520px) { .anim-btn .lbl { display: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Florent Youssef<small>BUT Réseaux &amp; Télécoms · parcours Cloud</small></div>
    <div class="top-right">
      <button class="anim-btn" id="anim-toggle" type="button" aria-pressed="true"><span class="sw" aria-hidden="true"></span><span class="lbl">Animations</span></button>
      <div class="status"><span class="led" aria-hidden="true"></span>Disponible<span class="long"> : alternance ou stage</span></div>
    </div>
  </header>

  <main class="map-wrap" aria-label="Carte du portfolio">
    <svg id="map" role="group" aria-label="Carte réseau du portfolio : chaque nœud ouvre une partie"></svg>
    <div class="hint" id="hint">Cliquez sur un nœud pour l'ouvrir</div>
  </main>

  <footer class="strip" aria-label="Conditions de l'alternance">
    <span>Alternance <b>dès maintenant → août 2028 · 3 sem. / 3 sem.</b></span>
    <span>ou Stage <b>10 semaines · 16 janv. → 28 mars 2027</b></span>
    <span>Zone <b>Narbonne · Béziers · Montpellier</b></span>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="p-title" aria-hidden="true">
  <div class="p-head">
    <div>
      <div class="crumb" id="crumb"></div>
      <h2 id="p-title"></h2>
    </div>
    <button class="close" id="close" type="button" aria-label="Fermer le panneau">✕</button>
  </div>
  <div class="p-body" id="p-body"></div>
</aside>

<!-- ============ Contenus des nœuds ============ -->

  <div class="two">

      <div class="k">Mon rôle : réseau et infrastructure</div>
      <ul>
        <li>Mise en place du broker MQTT Mosquitto qui reçoit les mesures des capteurs au format JSON.</li>
        <li>Configuration de la base InfluxDB pour stocker les mesures en séries temporelles.</li>
        <li>Participation au flux de données entre les services avec Telegraf.</li>
        <li>Configuration réseau de l'ensemble pendant le hackathon.</li>

    <div>
      <div class="k">Ce que j'en retiens</div>

    if (id !== "moi") { var sep2 = document.createElement("span"); sep2.textContent = "/ " + n.label; crumb.appendChild(sep2); }
    body.innerHTML = "";
    body.appendChild(document.getElementById("tpl-" + id).content.cloneNode(true));
    body.querySelectorAll("img[src='{{" + "PHOTO}}']").forEach(function (i) { i.src = PHOTO; });
    body.querySelectorAll("[data-open]").forEach(function (b) { b.addEventListener("click", function () { open(b.getAttribute("data-open")); }); });
    body.querySelectorAll("[data-copy]").forEach(function (b) {
      b.addEventListener("click", function () {
        var txt = b.getAttribute("data-copy");
        Promise.resolve().then(function () { return navigator.clipboard.writeText(txt); })
          .then(function () { b.textContent = "Copié"; }, function () { b.textContent = "Copie impossible"; })
          .then(function () { setTimeout(function () { b.textContent = "Copier"; }, 2000); });
      });
    });
    body.scrollTop = 0;
    var px = layout.pos[id][0];
    panel.classList.toggle("left", id !== "moi" && px < layout.w / 2);
    panel.classList.add("open"); scrim.classList.add("open");
    panel.setAttribute("aria-hidden", "false");
    document.getElementById("hint").style.visibility = "hidden";
    mark(id);
    sendPacket(id);
    if (!fromHash && location.hash !== "#" + id) location.hash = id;
    setTimeout(function () { document.getElementById("close").focus(); }, 50);
  }

  function close() {
    if (!current) return;
    current = null;
    panel.classList.remove("open"); scrim.classList.remove("open");
    panel.setAttribute("aria-hidden", "true");
    document.getElementById("hint").style.visibility = "";
    mark(null);
    if (location.hash) location.hash = "carte";
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  // Paquets qui circulent sur les fibres
  function sendPacket(target) {
    if (reduce || !layout) return;
    var hops = pathTo(target).reverse();
    var pts = [layout.pos.moi].concat(hops.map(function (k) { return layout.pos[k]; }));
    if (pts.length < 2) return;
    var dot = el("circle", { r: 5, "class": "pkt" }, svg._packets);
    var seg = 0, t = 0, speed = 0.035;
    function step() {
      var a = pts[seg], b = pts[seg + 1];
      t += speed;
      if (t >= 1) { t = 0; seg++; if (seg >= pts.length - 1) { dot.remove(); return; } a = pts[seg]; b = pts[seg + 1]; }
      dot.setAttribute("cx", a[0] + (b[0] - a[0]) * t);
      dot.setAttribute("cy", a[1] + (b[1] - a[1]) * t);
      requestAnimationFrame(step);
    }
    step();
  }
  // Particules : des bits qui circulent dans les deux sens sur chaque fibre
  var parts = [], lastT = 0;
  function makePart(id, t, dir, burst) {
    var glyph = Math.random() < 0.4, e;
    if (glyph) { e = el("text", { "class": "bit" }, svg._packets); e.textContent = Math.random() < 0.5 ? "0" : "1"; }
    else e = el("circle", { "class": "dot", r: (1.1 + Math.random() * 1.5).toFixed(2) }, svg._packets);
    return { id: id, t: t, dir: dir, speed: 0.07 + Math.random() * 0.13, el: e, glyph: glyph, burst: !!burst };
  }
  function setupParticles() {
    parts = [];
    if (reduce) return;
    Object.keys(linkEls).forEach(function (id) {
      var count = NODES[id].tier === 1 ? 8 : 4;
      for (var i = 0; i < count; i++) parts.push(makePart(id, Math.random(), i % 2 ? 1 : -1));
    });
  }
  function beatBurst() {
    if (reduce || !layout) return;
    Object.keys(linkEls).forEach(function (id) {
      if (NODES[id].tier !== 1) return;
      parts.push(makePart(id, 0, 1, true));
    });
  }
  function tick(now) {
    var dt = Math.min((now - (lastT || now)) / 1000, 0.05); lastT = now;
    var dimmed = svg.classList.contains("dim");
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i], line = linkEls[p.id];
      if (!line || !p.el.isConnected) { parts.splice(i, 1); continue; }
      var on = line.classList.contains("on");
      p.t += p.dir * p.speed * dt * (on ? 2.4 : 1) * (p.burst ? 2.2 : 1);
      if (p.t > 1 || p.t < 0) {
        if (p.burst) { p.el.remove(); parts.splice(i, 1); continue; }
        p.t = p.dir > 0 ? 0 : 1;
      }
      var a = layout.pos[NODES[p.id].parent], b = layout.pos[p.id];
      var dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1, off = p.dir * 4;
      var x = a[0] + dx * p.t - dy / len * off, y = a[1] + dy * p.t + dx / len * off;
      var op = Math.sin(Math.PI * p.t) * (on ? 1 : 0.8) * (dimmed && !on ? 0.2 : 1) * (p.burst ? 1 : 0.85);
      if (p.glyph) { p.el.setAttribute("x", x.toFixed(1)); p.el.setAttribute("y", y.toFixed(1)); }
      else { p.el.setAttribute("cx", x.toFixed(1)); p.el.setAttribute("cy", y.toFixed(1)); }
      p.el.setAttribute("opacity", op.toFixed(2));
    }
    if (reduce) { ticking = false; return; }
    requestAnimationFrame(tick);
  }
  function ambient() { if (!reduce && !ticking) { ticking = true; requestAnimationFrame(tick); } }

  scrim.addEventListener("click", close);
  document.getElementById("close").addEventListener("click", close);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
  function fromHash() {
    var h = location.hash.replace("#", "");
    if (NODES[h]) open(h, true); else if (current) close();
  }
  window.addEventListener("hashchange", fromHash);
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(draw, 120); });

  draw();
  ambient();
  fromHash();
})();
</script>
</body>
</html>
